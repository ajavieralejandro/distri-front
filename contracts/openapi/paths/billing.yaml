# Path Items for /invoices*, /receipts* — provisional (demo fiscal, SIN validez ARCA)
# $ref: ./paths/billing.yaml#/invoices | #/invoiceIssue | #/invoiceCancel |
#       #/receipts | #/receiptById

invoices:
  get:
    operationId: listInvoices
    summary: Listar facturas demo
    description: >
      Facturas demostrativas sin validez fiscal (ARCA). MSW responde array bare
      con money string; contrato provisional pagina y usa MoneyAmount.
    tags: [Billing]
    security:
      - bearerAuth: []
    x-contract-status: provisional
    x-allowed-roles:
      - DISTRIBUTOR_ADMIN
      - CASHIER
      - COMMERCE_OWNER
    parameters:
      - $ref: '../parameters/common.yaml#/PageParam'
      - $ref: '../parameters/common.yaml#/SizeParam'
      - $ref: '../parameters/common.yaml#/SortParam'
      - name: commerceId
        in: query
        required: false
        schema:
          $ref: '../schemas/common.yaml#/OpaqueId'
    responses:
      '200':
        description: Página de facturas.
        content:
          application/json:
            schema:
              type: object
              required: [items, page, size, totalItems, totalPages]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../schemas/entities.yaml#/Invoice'
                page:
                  type: integer
                size:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
            examples:
              invoices:
                value:
                  items:
                    - id: inv-12
                      number: DEMO-FC-000012
                      commerceId: com-el-puente
                      orderId: ord-1001
                      status: ISSUED_DEMO
                      issuedAt: '2026-07-25T14:45:00-03:00'
                      dueAt: '2026-08-24T23:59:59-03:00'
                      subtotal:
                        amount: '20400.00'
                        currency: ARS
                      tax:
                        amount: '0.00'
                        currency: ARS
                      total:
                        amount: '20400.00'
                        currency: ARS
                      items: []
                      disclaimer: DOCUMENTO DEMOSTRATIVO — SIN VALIDEZ FISCAL — NO AUTORIZADO POR ARCA
                  page: 0
                  size: 20
                  totalItems: 1
                  totalPages: 1
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../responses/errors.yaml#/Forbidden'
      '500':
        $ref: '../responses/errors.yaml#/InternalError'

  post:
    operationId: createInvoice
    summary: Crear factura demo (borrador)
    description: >
      Crea una factura DRAFT a partir de un pedido DELIVERED. Sin validez fiscal.
      Body: `{ orderId }`.
    tags: [Billing]
    security:
      - bearerAuth: []
    x-contract-status: provisional
    x-allowed-roles:
      - DISTRIBUTOR_ADMIN
      - CASHIER
    parameters:
      - $ref: '../parameters/common.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [orderId]
            additionalProperties: false
            properties:
              orderId:
                $ref: '../schemas/common.yaml#/OpaqueId'
          examples:
            fromOrder:
              value:
                orderId: ord-1001
    responses:
      '201':
        description: Factura borrador creada.
        content:
          application/json:
            schema:
              $ref: '../schemas/entities.yaml#/Invoice'
            examples:
              draft:
                value:
                  id: inv-13
                  number: DEMO-FC-000013
                  commerceId: com-el-puente
                  orderId: ord-1001
                  status: DRAFT
                  subtotal:
                    amount: '20400.00'
                    currency: ARS
                  tax:
                    amount: '0.00'
                    currency: ARS
                  total:
                    amount: '20400.00'
                    currency: ARS
                  items: []
                  disclaimer: DOCUMENTO DEMOSTRATIVO — SIN VALIDEZ FISCAL — NO AUTORIZADO POR ARCA
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../responses/errors.yaml#/Forbidden'
      '409':
        $ref: '../responses/errors.yaml#/Conflict'
      '422':
        $ref: '../responses/errors.yaml#/UnprocessableEntity'
      '500':
        $ref: '../responses/errors.yaml#/InternalError'

invoiceIssue:
  parameters:
    - name: invoiceId
      in: path
      required: true
      schema:
        $ref: '../schemas/common.yaml#/OpaqueId'
  post:
    operationId: issueInvoice
    summary: Emitir factura demo
    description: >
      Pasa la factura a ISSUED_DEMO y setea `issuedAt`. Sin validez fiscal ARCA.
    tags: [Billing]
    security:
      - bearerAuth: []
    x-contract-status: provisional
    x-allowed-roles:
      - DISTRIBUTOR_ADMIN
      - CASHIER
    responses:
      '200':
        description: Factura emitida (demo).
        content:
          application/json:
            schema:
              $ref: '../schemas/entities.yaml#/Invoice'
            examples:
              issued:
                value:
                  id: inv-13
                  number: DEMO-FC-000013
                  commerceId: com-el-puente
                  orderId: ord-1001
                  status: ISSUED_DEMO
                  issuedAt: '2026-07-25T15:00:00-03:00'
                  dueAt: '2026-08-24T23:59:59-03:00'
                  subtotal:
                    amount: '20400.00'
                    currency: ARS
                  tax:
                    amount: '0.00'
                    currency: ARS
                  total:
                    amount: '20400.00'
                    currency: ARS
                  items: []
                  disclaimer: DOCUMENTO DEMOSTRATIVO — SIN VALIDEZ FISCAL — NO AUTORIZADO POR ARCA
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
      '409':
        $ref: '../responses/errors.yaml#/Conflict'
      '500':
        $ref: '../responses/errors.yaml#/InternalError'

invoiceCancel:
  parameters:
    - name: invoiceId
      in: path
      required: true
      schema:
        $ref: '../schemas/common.yaml#/OpaqueId'
  post:
    operationId: cancelInvoice
    summary: Anular factura demo
    description: Marca la factura como CANCELLED_DEMO. Sin efecto fiscal real.
    tags: [Billing]
    security:
      - bearerAuth: []
    x-contract-status: provisional
    x-allowed-roles:
      - DISTRIBUTOR_ADMIN
      - CASHIER
    responses:
      '200':
        description: Factura anulada (demo).
        content:
          application/json:
            schema:
              $ref: '../schemas/entities.yaml#/Invoice'
            examples:
              cancelled:
                value:
                  id: inv-13
                  number: DEMO-FC-000013
                  commerceId: com-el-puente
                  orderId: ord-1001
                  status: CANCELLED_DEMO
                  subtotal:
                    amount: '20400.00'
                    currency: ARS
                  tax:
                    amount: '0.00'
                    currency: ARS
                  total:
                    amount: '20400.00'
                    currency: ARS
                  items: []
                  disclaimer: DOCUMENTO DEMOSTRATIVO — SIN VALIDEZ FISCAL — NO AUTORIZADO POR ARCA
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
      '409':
        $ref: '../responses/errors.yaml#/Conflict'
      '500':
        $ref: '../responses/errors.yaml#/InternalError'

receipts:
  get:
    operationId: listReceipts
    summary: Listar recibos demo
    description: >
      Recibos demostrativos asociados a pagos. No existe listado en MSW aún
      (los recibos se crean al registrar pagos); este contrato define la forma
      provisional con paginación y MoneyAmount.
    tags: [Billing]
    security:
      - bearerAuth: []
    x-contract-status: provisional
    x-allowed-roles:
      - DISTRIBUTOR_ADMIN
      - CASHIER
      - COMMERCE_OWNER
    parameters:
      - $ref: '../parameters/common.yaml#/PageParam'
      - $ref: '../parameters/common.yaml#/SizeParam'
      - $ref: '../parameters/common.yaml#/SortParam'
      - name: commerceId
        in: query
        required: false
        schema:
          $ref: '../schemas/common.yaml#/OpaqueId'
    responses:
      '200':
        description: Página de recibos.
        content:
          application/json:
            schema:
              type: object
              required: [items, page, size, totalItems, totalPages]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../schemas/entities.yaml#/Receipt'
                page:
                  type: integer
                size:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
            examples:
              receipts:
                value:
                  items:
                    - id: rcp-15
                      number: DEMO-RC-000015
                      commerceId: com-el-puente
                      paymentId: pay-15
                      issuedAt: '2026-07-24T17:20:00-03:00'
                      amount:
                        amount: '15000.00'
                        currency: ARS
                      paymentMethod: TRANSFER
                      allocations:
                        - description: Pago registrado en demo
                          amount:
                            amount: '15000.00'
                            currency: ARS
                      disclaimer: RECIBO DEMOSTRATIVO — SIN VALIDEZ FISCAL
                  page: 0
                  size: 20
                  totalItems: 1
                  totalPages: 1
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../responses/errors.yaml#/Forbidden'
      '500':
        $ref: '../responses/errors.yaml#/InternalError'

receiptById:
  parameters:
    - name: receiptId
      in: path
      required: true
      schema:
        $ref: '../schemas/common.yaml#/OpaqueId'
  get:
    operationId: getReceiptById
    summary: Obtener recibo demo por ID
    description: Detalle de un recibo demostrativo sin validez fiscal.
    tags: [Billing]
    security:
      - bearerAuth: []
    x-contract-status: provisional
    x-allowed-roles:
      - DISTRIBUTOR_ADMIN
      - CASHIER
      - COMMERCE_OWNER
    responses:
      '200':
        description: Recibo encontrado.
        content:
          application/json:
            schema:
              $ref: '../schemas/entities.yaml#/Receipt'
            examples:
              receipt:
                value:
                  id: rcp-15
                  number: DEMO-RC-000015
                  commerceId: com-el-puente
                  paymentId: pay-15
                  issuedAt: '2026-07-24T17:20:00-03:00'
                  amount:
                    amount: '15000.00'
                    currency: ARS
                  paymentMethod: TRANSFER
                  allocations:
                    - description: Pago registrado en demo
                      amount:
                        amount: '15000.00'
                        currency: ARS
                  disclaimer: RECIBO DEMOSTRATIVO — SIN VALIDEZ FISCAL
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
      '500':
        $ref: '../responses/errors.yaml#/InternalError'
