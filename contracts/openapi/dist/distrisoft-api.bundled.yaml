openapi: 3.1.0
info:
  title: Distrisoft API
  version: 0.1.0-provisional
  summary: Provisional commercial API for Distrisoft
  description: |
    **PROVISIONAL — not a stable contract.**

    Derived from the Distrisoft web demo (MSW handlers, feature clients, and types).
    OpenAPI is the provisional source of truth for the future Spring Boot backend.

    Important:
    - UI roles adapt navigation only. Authorization is enforced by the API.
    - Demo invoices/receipts have **no fiscal validity** (not ARCA-authorized).
    - MSW currently returns bare arrays and string money; this contract targets
      paginated list envelopes and `MoneyAmount` objects.
    - See `contracts/decisions/` for open questions.

    Traceability: `contracts/traceability.md`
  license:
    name: Proprietary
    url: https://example.invalid/license
servers:
  - url: http://localhost:8080/api
    description: Local Spring Boot (future)
  - url: http://localhost:4010/api
    description: OpenAPI mock (Prism)
  - url: https://api-staging.example.invalid/api
    description: Staging example only — not a real environment
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Current user
  - name: Customers
  - name: Products
  - name: Orders
  - name: Inventory
  - name: Delivery
  - name: Accounts
  - name: Payments
  - name: Billing
  - name: Analytics
  - name: Users
  - name: Audit
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      description: |
        Health check público del API. No requiere autenticación. Nota: la demo MSW puede no exponer este endpoint con el mismo contrato; esta operación define la forma provisional objetivo.
      tags:
        - System
      security: []
      x-contract-status: provisional
      x-allowed-roles: []
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  summary: API saludable
                  value:
                    status: ok
                    service: distrisoft-api
                    timestamp: '2026-07-25T16:05:00-03:00'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      description: |
        Autentica con email y contraseña y devuelve un par de tokens más el usuario actual. Reemplaza el endpoint demo `POST /auth/demo/login`, que hoy responde solo con una sesión en memoria (sin JWT). Formato exacto del token: pendiente (ver decisions/authentication.md).
      tags:
        - Authentication
      security: []
      x-contract-status: provisional
      x-allowed-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 1
            examples:
              adminDemo:
                summary: Administrador distribuidor (ficticio)
                value:
                  email: admin@demo.distrisoft.local
                  password: demo1234
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tokens
                  - user
                additionalProperties: false
                properties:
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
                  user:
                    $ref: '#/components/schemas/CurrentUser'
              examples:
                adminSession:
                  summary: Sesión de administrador
                  value:
                    tokens:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo-access
                      refreshToken: opaque-refresh-token-demo
                      tokenType: Bearer
                      expiresIn: 3600
                    user:
                      userId: usr-admin
                      role: DISTRIBUTOR_ADMIN
                      displayName: Administrador Demo
                      email: admin@demo.distrisoft.local
                      distributorId: dist-1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Renovar tokens
      description: |
        Intercambia un refresh token válido por un nuevo TokenPair. No existe en la demo MSW; es parte del contrato provisional para SPA.
      tags:
        - Authentication
      security: []
      x-contract-status: provisional
      x-allowed-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              additionalProperties: false
              properties:
                refreshToken:
                  type: string
                  minLength: 1
            examples:
              refresh:
                value:
                  refreshToken: opaque-refresh-token-demo
      responses:
        '200':
          description: Tokens renovados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                renewed:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo-access-2
                    refreshToken: opaque-refresh-token-demo-rotated
                    tokenType: Bearer
                    expiresIn: 3600
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      summary: Cerrar sesión
      description: |
        Invalida el access/refresh token del servidor. La demo MSW responde 204 sin invalidación real (`POST /auth/demo/logout`).
      tags:
        - Authentication
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - CASHIER
        - DRIVER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Usuario autenticado
      description: |
        Devuelve la identidad y alcance del caller según el token Bearer. Sustituye `GET /auth/demo/session?userId=...` de la demo.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - CASHIER
        - DRIVER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      responses:
        '200':
          description: Usuario actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                salesUser:
                  value:
                    userId: usr-sales
                    role: SALES
                    displayName: Ventas Demo
                    email: ventas@demo.distrisoft.local
                    distributorId: dist-1
                commerceOwner:
                  value:
                    userId: usr-commerce-owner
                    role: COMMERCE_OWNER
                    displayName: Dueño Comercio Demo
                    email: comercio@demo.distrisoft.local
                    distributorId: dist-1
                    commerceId: com-el-puente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/permissions:
    get:
      operationId: getMyPermissions
      summary: Permisos efectivos del usuario
      description: |
        Lista los permisos efectivos del caller (RBAC de servidor). No existe en MSW; la demo calcula permisos solo en el cliente (`src/features/auth/permissions.ts`). Este contrato es la forma objetivo.
      tags:
        - Current user
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - CASHIER
        - DRIVER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      responses:
        '200':
          description: Permisos del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - role
                  - permissions
                additionalProperties: false
                properties:
                  role:
                    $ref: '#/components/schemas/DemoRole'
                  permissions:
                    type: array
                    items:
                      type: string
                      example: orders:create
              examples:
                salesPermissions:
                  summary: Ventas
                  value:
                    role: SALES
                    permissions:
                      - analytics:view_global
                      - customers:read
                      - products:read
                      - orders:create
                      - orders:read_all
                      - orders:confirm
                      - orders:cancel
                pickerPermissions:
                  summary: Depósito
                  value:
                    role: WAREHOUSE_PICKER
                    permissions:
                      - products:read
                      - orders:read_all
                      - orders:prepare
                      - inventory:read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/contexts:
    get:
      operationId: getMyContexts
      summary: Contextos / alcances del usuario
      description: |
        Devuelve los alcances (distributor, commerce, warehouse, route) disponibles para el usuario autenticado. Provisional: la demo guarda estos campos en la sesión local sin endpoint dedicado.
      tags:
        - Current user
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - CASHIER
        - DRIVER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      responses:
        '200':
          description: Contextos activos y disponibles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - active
                additionalProperties: false
                properties:
                  active:
                    type: object
                    additionalProperties: false
                    properties:
                      distributorId:
                        $ref: '#/components/schemas/OpaqueId'
                      commerceId:
                        $ref: '#/components/schemas/OpaqueId'
                      branchId:
                        $ref: '#/components/schemas/OpaqueId'
                      warehouseId:
                        $ref: '#/components/schemas/OpaqueId'
                      assignedRouteId:
                        $ref: '#/components/schemas/OpaqueId'
                  availableCommerces:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - tradeName
                      properties:
                        id:
                          $ref: '#/components/schemas/OpaqueId'
                        tradeName:
                          type: string
                  availableWarehouses:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          $ref: '#/components/schemas/OpaqueId'
                        name:
                          type: string
                  availableRoutes:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          $ref: '#/components/schemas/OpaqueId'
                        name:
                          type: string
              examples:
                driverContext:
                  summary: Chofer con ruta asignada
                  value:
                    active:
                      distributorId: dist-1
                      assignedRouteId: route-norte
                    availableRoutes:
                      - id: route-norte
                        name: Recorrido Zona Norte — CABA
                commerceBuyer:
                  summary: Comprador de comercio
                  value:
                    active:
                      distributorId: dist-1
                      commerceId: com-el-puente
                      branchId: br-el-puente-1
                    availableCommerces:
                      - id: com-el-puente
                        tradeName: Almacén El Puente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /customers:
    get:
      operationId: listCustomers
      summary: Listar comercios / clientes
      description: |
        Lista comercios del distribuidor con filtros opcionales. La demo MSW actualmente responde un array bare de `Commerce` con money como string decimal (sin paginación ni MoneyAmount). Este contrato es la forma provisional objetivo con página y MoneyAmount `{amount, currency}`.
      tags:
        - Customers
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - CASHIER
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Busca por razón social, nombre de fantasía o CUIT.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
      responses:
        '200':
          description: Página de comercios.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - size
                  - totalItems
                  - totalPages
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commerce'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
              examples:
                page0:
                  value:
                    items:
                      - id: com-el-puente
                        businessName: Almacén El Puente S.R.L.
                        tradeName: Almacén El Puente
                        taxId: 30-71234567-8
                        status: ACTIVE
                        paymentTerms: Cuenta corriente 30 días
                        creditLimit:
                          amount: '500000.00'
                          currency: ARS
                        balance:
                          amount: '87500.50'
                          currency: ARS
                        email: compras@elpuente.demo
                        phone: +54 11 4567-8901
                        address: Av. San Martín 1450, Villa Crespo, CABA
                      - id: com-mercado-norte
                        businessName: Mercado Norte S.A.
                        tradeName: Mercado Norte
                        taxId: 30-70998877-1
                        status: ACTIVE
                        paymentTerms: Contado / transferencia
                        creditLimit:
                          amount: '250000.00'
                          currency: ARS
                        balance:
                          amount: '12000.00'
                          currency: ARS
                        email: pedidos@mercadonorte.demo
                        phone: +54 11 4789-1122
                        address: Cabrera 3200, Palermo, CABA
                    page: 0
                    size: 20
                    totalItems: 4
                    totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueId'
        description: Identificador opaco del comercio.
    get:
      operationId: getCustomerById
      summary: Obtener comercio por ID
      description: |
        Detalle de un comercio. Recursos fuera de alcance del tenant deben responder 404 (política provisional de aislamiento).
      tags:
        - Customers
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - CASHIER
        - COMMERCE_OWNER
      responses:
        '200':
          description: Comercio encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commerce'
              examples:
                elPuente:
                  value:
                    id: com-el-puente
                    businessName: Almacén El Puente S.R.L.
                    tradeName: Almacén El Puente
                    taxId: 30-71234567-8
                    status: ACTIVE
                    paymentTerms: Cuenta corriente 30 días
                    creditLimit:
                      amount: '500000.00'
                      currency: ARS
                    balance:
                      amount: '87500.50'
                      currency: ARS
                    email: compras@elpuente.demo
                    phone: +54 11 4567-8901
                    address: Av. San Martín 1450, Villa Crespo, CABA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /products:
    get:
      operationId: listProducts
      summary: Listar productos
      description: |
        Catálogo de productos del distribuidor. MSW demo responde un array bare con `price` como string; el contrato provisional usa paginación y MoneyAmount `{amount, currency: ARS}`.
      tags:
        - Products
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Busca por nombre, SKU o descripción.
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - size
                  - totalItems
                  - totalPages
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
              examples:
                bebidas:
                  value:
                    items:
                      - id: prod-agua-15
                        sku: BEB-001
                        name: Agua mineral
                        description: Agua mineral sin gas 1.5 L
                        categoryId: cat-bebidas
                        unit: UNIT
                        presentation: Botella 1.5 L
                        price:
                          amount: '850.00'
                          currency: ARS
                        availableStock: 240
                        active: true
                      - id: prod-gaseosa-cola
                        sku: BEB-014
                        name: Gaseosa cola
                        description: Pack x6 de 2.25 L
                        categoryId: cat-bebidas
                        unit: PACK
                        presentation: Pack x6 2.25 L
                        price:
                          amount: '12500.50'
                          currency: ARS
                        availableStock: 48
                        active: true
                    page: 0
                    size: 20
                    totalItems: 2
                    totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueId'
    get:
      operationId: getProductById
      summary: Obtener producto por ID
      description: Detalle de un producto del catálogo.
      tags:
        - Products
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      responses:
        '200':
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                agua:
                  value:
                    id: prod-agua-15
                    sku: BEB-001
                    name: Agua mineral
                    description: Agua mineral sin gas 1.5 L
                    categoryId: cat-bebidas
                    unit: UNIT
                    presentation: Botella 1.5 L
                    price:
                      amount: '850.00'
                      currency: ARS
                    availableStock: 240
                    active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      operationId: listCategories
      summary: Listar categorías
      description: |
        Categorías del catálogo. MSW responde un array bare; el contrato provisional agrega envoltorio paginado para consistencia.
      tags:
        - Products
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Página de categorías.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - size
                  - totalItems
                  - totalPages
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
              examples:
                cats:
                  value:
                    items:
                      - id: cat-bebidas
                        name: Bebidas
                      - id: cat-almacen
                        name: Almacén
                      - id: cat-limpieza
                        name: Limpieza
                    page: 0
                    size: 20
                    totalItems: 3
                    totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    get:
      operationId: listOrders
      summary: Listar pedidos
      description: |
        Lista pedidos del alcance del caller (distribuidor o comercio propio). MSW demo responde un array bare con money como string y sin paginación. Este contrato es la forma provisional objetivo (página + MoneyAmount).
      tags:
        - Orders
      security:
        - bearerAuth: []
      x-contract-status: provisional
      x-allowed-roles:
        - DISTRIBUTOR_ADMIN
        - SALES
        - WAREHOUSE_PICKER
        - DRIVER
        - COMMERCE_OWNER
        - COMMERCE_BUYER
        - COMMERCE_CASHIER
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: commerceId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: warehouseId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: routeId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
      responses:
        '200':
          description: Página de pedidos.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - size
                  - totalItems
                  - totalPages
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
              examples:
                pendingPage:
                  value:
                    items:
                      - id: ord-1001
                        number: PED-1001
                        commerceId: com-el-puente
                        branchId: br-el-puente-1
                        warehouseId: wh-1
                        status: PENDING
                        priority: NORMAL
                        createdAt: '2026-07-25T09:15:00-03:00'
                        updatedAt: '2026-07-25T09:15:00-03:00'
                        items:
                          - productId: prod-agua-15
                            sku: BEB-001
                            name: Agua mineral
                            unitPrice:
                              amount: '850.00'
                              currency: ARS
