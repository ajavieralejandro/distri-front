PageParam:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 0
    default: 0
  description: Página cero-indexada (provisional).

SizeParam:
  name: size
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

SortParam:
  name: sort
  in: query
  required: false
  schema:
    type: string
    example: createdAt,desc
  description: Campo y dirección. Convención provisional.

IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  required: false
  schema:
    type: string
    format: uuid
  description: >
    Clave de idempotencia para operaciones sensibles.
    Si se repite con el mismo payload, la API debe devolver el mismo resultado
    sin duplicar efectos. Ver decisions/idempotency.md.
