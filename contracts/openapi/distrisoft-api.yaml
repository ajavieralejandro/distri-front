openapi: 3.1.0
info:
  title: Distrisoft API
  version: 0.1.0-provisional
  summary: Provisional commercial API for Distrisoft
  description: |
    **PROVISIONAL — not a stable contract.**

    Derived from the Distrisoft web demo (MSW handlers, feature clients, and types).
    OpenAPI is the provisional source of truth for the future Spring Boot backend.

    Important:
    - UI roles adapt navigation only. Authorization is enforced by the API.
    - Demo invoices/receipts have **no fiscal validity** (not ARCA-authorized).
    - MSW currently returns bare arrays and string money; this contract targets
      paginated list envelopes and `MoneyAmount` objects.
    - See `contracts/decisions/` for open questions.

    Traceability: `contracts/traceability.md`
  license:
    name: Proprietary
    url: https://example.invalid/license

servers:
  - url: http://localhost:8080/api
    description: Local Spring Boot (future)
  - url: http://localhost:4010/api
    description: OpenAPI mock (Prism)
  - url: https://api-staging.example.invalid/api
    description: Staging example only — not a real environment

